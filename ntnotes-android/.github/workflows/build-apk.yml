name: Build NT Notes APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add google-services.json from the repository secret (if you set one)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Download it from Firebase console > Project settings > Your apps > Android, then either commit it as app/google-services.json or paste its contents into a repository secret named GOOGLE_SERVICES_JSON."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ntnotes-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
